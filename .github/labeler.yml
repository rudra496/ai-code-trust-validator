core:
  - changed-files:
      - any-glob-to-any-file: "ai_trust_validator/**"

tests:
  - changed-files:
      - any-glob-to-any-file: "tests/**"

extensions:
  - changed-files:
      - any-glob-to-any-file:
          - "vscode-extension/**"
          - "jetbrains-plugin/**"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "docker-compose.yml"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "action.yml"
          - ".aitrust.yaml"
